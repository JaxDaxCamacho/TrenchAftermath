name: Build & deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish TrenchAftermath/TrenchAftermath.csproj -c Release -o output

      - name: Show publish output
        run: |
          echo "=== output/ ==="
          ls -la output/ || true
          echo
          echo "=== output/_framework/ (first 20) ==="
          ls -la output/_framework/ 2>/dev/null | head -20 || true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output --project-name=trench-aftermath --branch=main
