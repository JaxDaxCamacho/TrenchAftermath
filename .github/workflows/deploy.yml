name: Build & deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Show dotnet version
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore TrenchAftermath/TrenchAftermath.csproj

      - name: Build
        run: dotnet build TrenchAftermath/TrenchAftermath.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish TrenchAftermath/TrenchAftermath.csproj -c Release --no-build -o output

      - name: Verify output exists
        run: |
          echo "=== output/wwwroot/ contents ==="
          ls -la output/wwwroot/
          if [ ! -f "output/wwwroot/index.html" ]; then
            echo "ERROR: index.html not found in output/wwwroot!"
            exit 1
          fi
          if [ ! -d "output/wwwroot/_framework" ]; then
            echo "ERROR: _framework directory not found in output/wwwroot!"
            exit 1
          fi
          echo "=== output/wwwroot/_framework/ (first 20 files) ==="
          ls -la output/wwwroot/_framework/ | head -20

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output/wwwroot --project-name=trench-aftermath --branch=main